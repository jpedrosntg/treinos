<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treinos">
<title>Treinos</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f1115;color:#eee;padding:env(safe-area-inset-top) 12px 170px}
h1{font-size:22px;margin:14px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:14px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#1d2129;color:#aaa}
.tabs button.on{background:#3b82f6;color:#fff}
.card{background:#1a1d24;border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.nm{font-size:18px;font-weight:600}
.info{color:#9aa;font-size:14px;margin-top:4px}
.ser{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ser button{width:48px;height:48px;border-radius:50%;border:2px solid #3b82f6;background:none;color:#fff;font-size:16px}
.ser button.ok{background:#22c55e;border-color:#22c55e}
.ser button.cur{outline:3px solid #f59e0b;outline-offset:2px}
.drag{touch-action:none;cursor:grab;color:#666;font-size:22px;padding:4px 10px 4px 0;user-select:none}
.card.arr{opacity:.6;border:1px dashed #3b82f6}
.ic{background:none;border:0;color:#888;font-size:20px;padding:4px 8px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:600;margin-top:8px}
.add{background:#1d2129;color:#3b82f6}.fin{background:#22c55e;color:#fff}
.iniciar{background:#3b82f6;color:#fff;font-size:18px;font-weight:800;margin:0 0 12px}
.iniciar.ativo{background:#ef4444}
.timer{position:fixed;left:0;right:0;bottom:0;background:#161920;border-top:1px solid #2a2f3a;padding:12px 16px calc(12px + env(safe-area-inset-bottom));text-align:center}
.tm{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.tm.over{color:#ef4444}.lbl{color:#9aa;font-size:13px}
.tb{display:flex;gap:8px;margin-top:6px}.tb button{flex:1;padding:10px;border:0;border-radius:10px;background:#2a2f3a;color:#fff;font-size:15px}
.tb .acao{background:#3b82f6;font-weight:700}
.tb .acao.prox{background:#22c55e}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end}
.modal.on{display:flex}
.box{background:#1a1d24;width:100%;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
label{display:block;font-size:13px;color:#9aa;margin-top:10px}
input,select{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid #333;background:#0f1115;color:#fff}
.row{display:flex;gap:8px}.row>div{flex:1}
.hist{font-size:14px;color:#bbb}.hist .card div{margin-top:4px}
#telaLogin{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.head{display:flex;justify-content:space-between;align-items:center}
.sair{background:#2a2f3a;color:#fff;border:0;border-radius:10px;padding:8px 12px}
.adm{background:#2b1f0f;border:1px solid #f59e0b;border-radius:12px;padding:10px;margin-bottom:12px}
#telaAdmin{display:none}
.aluno{background:#1a1d24;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid #2a2f3a}
.aluno:active{background:#232733}
.aluno.eu{border-color:#f59e0b}
.voltar{background:#2a2f3a;color:#fff;border:0;border-radius:10px;padding:10px 12px;width:100%;font-size:15px;margin-top:6px}
</style></head><body>

<!-- TELA DE LOGIN -->
<div id="telaLogin">
  <div style="font-size:64px">🏋️</div>
  <h1>Meus Treinos</h1>
  <div class="info" id="msgLogin">Carregando...</div>
  <button id="btnLogin" class="btn fin" onclick="entrar()" style="display:none;max-width:320px">🔐 Entrar com Google</button>
</div>

<!-- TELA DO ADMIN -->
<div id="telaAdmin">
  <div class="head">
    <h1>👑 Painel do Admin</h1>
    <button class="sair" onclick="sair()">Sair</button>
  </div>
  <div class="info" style="margin-bottom:10px">Escolha qual treino deseja ver:</div>
  <input id="buscaAluno" placeholder="🔍 Buscar por nome ou e-mail" oninput="renderAlunos(this.value)" style="margin-bottom:12px">
  <div id="listaAlunos"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="head">
    <h1>🏋️ Meus Treinos</h1>
    <button class="sair" onclick="sair()">Sair</button>
  </div>
  <div id="userInfo" class="info" style="margin-bottom:10px"></div>

  <div id="adminBar" class="adm" style="display:none">
    <div class="lbl">👑 Modo administrador</div>
    <button class="voltar" onclick="voltarAdmin()">⬅ Voltar para lista de alunos</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <button id="bTreino" class="btn iniciar" onclick="toggleTreino()">▶ INICIAR TREINO</button>
  <div id="list"></div>
  <button class="btn add" onclick="openForm()">+ Adicionar exercício</button>
  <button class="btn fin" onclick="finish()">✔ Finalizar treino</button>
  <h1 style="font-size:18px;margin-top:24px">Histórico</h1>
  <div id="hist" class="hist"></div>
  <h1 style="font-size:18px;margin-top:24px">Backup</h1>
  <div class="row">
    <div><button class="btn add" onclick="exportar()">⬇ Tudo</button></div>
    <div><button class="btn add" onclick="exportarHist()">⬇ Histórico</button></div>
    <div><button class="btn add" onclick="$('imp').click()">⬆ Importar</button></div>
  </div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importar(this)">

  <div class="timer">
    <div class="lbl" id="tlbl">Treino A</div>
    <div class="tm" id="tm">00:00</div>
    <div class="tb">
      <button onclick="parar()">■ Parar</button>
      <button id="bAcao" class="acao" onclick="acao()">⏱ Descanso</button>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="box">
  <div class="nm" id="ftitle">Exercício</div>
  <label>Nome</label><input id="fn" placeholder="Ex: Supino reto">
  <div class="row">
    <div><label>Séries</label><input id="fs" type="number" inputmode="numeric" value="3"></div>
    <div><label>Repetições</label><input id="fr" inputmode="text" value="12"></div>
  </div>
  <div class="row">
    <div><label>Peso (kg)</label><input id="fp" type="number" inputmode="decimal" step="0.5" value="0"></div>
    <div><label>Descanso (s)</label><input id="fd" type="number" inputmode="numeric" value="60"></div>
  </div>
  <button class="btn fin" onclick="saveForm()">Salvar</button>
  <button class="btn add" onclick="closeForm()">Cancelar</button>
</div></div>

<script>
const KEY='treinos_v1';
const VAZIO=()=>({A:[],B:[],C:[],hist:[]});
let data=VAZIO(), cur='A', done={}, edit=-1;
let tStart=null, target=60, tInt=null, beeped=false;
let pos={i:0,j:0}, fase='descanso';
let ativo=false, audio=null, bip=null, ultMeta='';
const $=id=>document.getElementById(id);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function setData(d){ data=d&&d.A?d:VAZIO(); data.hist=data.hist||[]; done={}; pos={i:0,j:0}; fase='descanso'; render(); }
function save(){ window.salvarNuvem && window.salvarNuvem(); }

function nomeTreino(){
  const e=data[cur][pos.i];
  return 'Treino '+cur+(e?' • '+e.name+' — série '+(pos.j+1)+'/'+e.sets:'');
}

function trocar(t){ cur=t; pos={i:0,j:0}; fase='descanso'; stopTimer(); render(); }

function render(){
  const ex=data[cur];
  if(pos.i>=ex.length) pos={i:0,j:0};
  if(ex[pos.i] && pos.j>=ex[pos.i].sets) pos.j=0;

  $('tabs').innerHTML=['A','B','C'].map(t=>`<button class="${t==cur?'on':''}" onclick="trocar('${t}')">Treino ${t}</button>`).join('');
  $('list').innerHTML=ex.map((e,i)=>{
    const d=done[cur+i]||[]; let s='';
    for(let j=0;j<e.sets;j++) s+=`<button class="${d[j]?'ok':''} ${i==pos.i&&j==pos.j?'cur':''}" onclick="tog(${i},${j})">${j+1}</button>`;
    return `<div class="card" data-i="${i}"><div class="top"><div style="display:flex;align-items:center">
      <span class="drag">☰</span><div><div class="nm">${e.name}</div>
      <div class="info">${e.sets}x${e.reps} • ${e.weight} kg • ${e.rest}s descanso</div></div></div>
      <div><button class="ic" onclick="openForm(${i})">✏️</button><button class="ic" onclick="del(${i})">🗑</button></div></div>
      <div class="ser">${s}</div></div>`;
  }).join('') || '<div class="info">Nenhum exercício no treino '+cur+'.</div>';
  $('hist').innerHTML=data.hist.slice().reverse().slice(0,15).map(h=>
    `<div class="card"><b>Treino ${h.tipo}</b> — ${h.data}${h.ex.map(e=>`<div>• ${e.name}: ${e.feitas}/${e.sets} séries x${e.reps} @ ${e.weight}kg</div>`).join('')}</div>`).join('');

  const b=$('bAcao');
  b.textContent=fase==='descanso'?'⏱ Descanso':'⏭ Próximo';
  b.classList.toggle('prox',fase!=='descanso');
  const bt=$('bTreino');
  bt.textContent=ativo?'■ ENCERRAR TREINO':'▶ INICIAR TREINO';
  bt.classList.toggle('ativo',ativo);
  tick();
}

// Selecionar série: marca/desmarca e define etapa atual (sem iniciar cronômetro)
function tog(i,j){
  const k=cur+i; done[k]=done[k]||[]; done[k][j]=!done[k][j];
  pos={i,j}; fase='descanso'; stopTimer(); render();
}

// Botão único Descanso / Próximo
function acao(){ fase==='descanso'?descansar():proximo(); }
function descansar(){
  const ex=data[cur]; if(!ex.length) return;
  const k=cur+pos.i; done[k]=done[k]||[]; done[k][pos.j]=true;
  target=+ex[pos.i].rest||60; startTimer(); fase='proximo'; render();
}
function proximo(){
  const ex=data[cur]; if(!ex.length) return;
  stopTimer();
  if(pos.j+1<ex[pos.i].sets) pos.j++;
  else if(pos.i+1<ex.length) pos={i:pos.i+1,j:0};
  else if(!document.hidden) alert('Último exercício concluído! Toque em "Finalizar treino".');
  fase='descanso'; render();
}
function anterior(){
  const ex=data[cur]; if(!ex.length) return;
  stopTimer();
  if(pos.j>0) pos.j--;
  else if(pos.i>0){ pos.i--; pos.j=ex[pos.i].sets-1; }
  fase='descanso'; render();
}
function parar(){ stopTimer(); fase='descanso'; render(); }

// ===== INICIAR TREINO + TELA DE BLOQUEIO (Media Session) =====
function wav(seg,comBip){
  const sr=8000,n=sr*seg,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let k=0;k<n;k++){
    const t=k/sr, on=comBip&&[0,.3,.6].some(x=>t>=x&&t<x+.2);
    v.setInt16(44+k*2,on?Math.sin(2*Math.PI*880*t)*20000:0,true);
  }
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function acaoMidia(){ acao(); audio&&audio.play().catch(()=>{}); }
function setHandlers(on){
  const ms=navigator.mediaSession; if(!ms) return;
  const h={play:acaoMidia,pause:acaoMidia,nexttrack:proximo,previoustrack:anterior};
  for(const k in h){ try{ ms.setActionHandler(k,on?h[k]:null); }catch(e){} }
  for(const k of ['seekbackward','seekforward','seekto']){ try{ ms.setActionHandler(k,null); }catch(e){} }
}
function iniciarTreino(){
  if(!data[cur].length) return alert('Adicione exercícios ao Treino '+cur+' primeiro.');
  ativo=true; pos={i:0,j:0}; fase='descanso'; ultMeta=''; stopTimer();
  if(!audio){ audio=new Audio(wav(10)); audio.loop=true; }
  audio.play().catch(()=>{});
  if(!bip){ bip=new Audio(wav(1,true)); bip.muted=true; bip.play().then(()=>{bip.pause();bip.currentTime=0;bip.muted=false;}).catch(()=>{bip.muted=false;}); }
  setHandlers(true); render();
}
function encerrarTreino(){
  ativo=false; stopTimer(); fase='descanso';
  if(audio) audio.pause();
  setHandlers(false);
  if(navigator.mediaSession){ navigator.mediaSession.metadata=null; navigator.mediaSession.playbackState='none'; }
  render();
}
function toggleTreino(){ if(!ativo) iniciarTreino(); else if(confirm('Encerrar treino?')) encerrarTreino(); }

function atualizarMidia(s){
  const ms=navigator.mediaSession; if(!ativo||!ms||!window.MediaMetadata) return;
  const e=data[cur][pos.i], ser=e?e.name+' — série '+(pos.j+1)+'/'+e.sets:'Treino '+cur;
  const title=tStart?'⏱ '+fmt(s)+' / '+target+'s':ser;
  const artist=tStart?ser+' • ⏭ Próximo':'Treino '+cur+' • ▶ Descanso';
  if(title+artist!==ultMeta){ ultMeta=title+artist; ms.metadata=new MediaMetadata({title,artist,album:'Meus Treinos'}); }
  ms.playbackState=tStart?'playing':'paused';
  try{ tStart?ms.setPositionState({duration:Math.max(target,s+1),playbackRate:1,position:Math.min(s,Math.max(target,s+1))}):ms.setPositionState(); }catch(err){}
}

function del(i){ if(confirm('Excluir exercício?')){ data[cur].splice(i,1); done={}; pos={i:0,j:0}; save(); render(); } }
function openForm(i=-1){
  edit=i; const e=i>=0?data[cur][i]:{name:'',sets:3,reps:12,weight:0,rest:60};
  $('ftitle').textContent=(i>=0?'Editar':'Novo')+' exercício — Treino '+cur;
  $('fn').value=e.name;$('fs').value=e.sets;$('fr').value=e.reps;$('fp').value=e.weight;$('fd').value=e.rest;
  $('modal').classList.add('on');
}
function closeForm(){ $('modal').classList.remove('on'); }
function saveForm(){
  const e={name:$('fn').value.trim()||'Exercício',sets:+$('fs').value||1,reps:$('fr').value,weight:+$('fp').value||0,rest:+$('fd').value||60};
  edit>=0?data[cur][edit]=e:data[cur].push(e); save(); closeForm(); render();
}
function finish(){
  if(!confirm('Finalizar treino '+cur+'?'))return;
  const ex=data[cur].map((e,i)=>({...e,feitas:(done[cur+i]||[]).filter(Boolean).length}));
  data.hist.push({tipo:cur,data:new Date().toLocaleString('pt-BR'),ex});
  data[cur].forEach((_,i)=>delete done[cur+i]); pos={i:0,j:0}; fase='descanso'; encerrarTreino(); save(); render();
}

// Arrastar para reordenar (toque e mouse)
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag'); if(!h) return;
  e.preventDefault(); drag=h.closest('.card'); drag.classList.add('arr');
});
document.addEventListener('pointermove',e=>{
  if(!drag) return; e.preventDefault();
  const sob=document.elementFromPoint(e.clientX,e.clientY)?.closest('#list .card');
  if(!sob||sob===drag) return;
  const r=sob.getBoundingClientRect();
  sob.parentNode.insertBefore(drag, e.clientY<r.top+r.height/2?sob:sob.nextSibling);
});
document.addEventListener('pointerup',()=>{
  if(!drag) return;
  drag.classList.remove('arr'); drag=null;
  const ordem=[...$('list').children].map(c=>+c.dataset.i);
  const ex=data[cur], atual=ex[pos.i], nd={};
  ordem.forEach((old,n)=>{ if(done[cur+old]) nd[cur+n]=done[cur+old]; });
  Object.keys(done).filter(k=>k[0]===cur).forEach(k=>delete done[k]);
  Object.assign(done,nd);
  data[cur]=ordem.map(o=>ex[o]);
  pos.i=Math.max(0,data[cur].indexOf(atual));
  save(); render();
});

// Backup
async function compartilhar(obj,nome){
  const file=new File([JSON.stringify(obj,null,2)],nome,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=nome; a.click();
}
function hoje(){ return new Date().toISOString().slice(0,10); }
function exportar(){ compartilhar(data,'treinos-'+hoje()+'.json'); }
function exportarHist(){ compartilhar({hist:data.hist},'historico-'+hoje()+'.json'); }
function importar(inp){
  const f=inp.files[0]; if(!f)return;
  f.text().then(t=>{ try{ const d=JSON.parse(t); if(!d.A||!d.hist)throw 0;
    if(confirm('Substituir dados atuais pelo backup?')){ setData(d); save(); } }catch(e){ alert('Arquivo inválido (use o arquivo do botão "Tudo")'); } inp.value=''; });
}

// Cronômetro
let actx;
function beep(){
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
  if(bip){ bip.currentTime=0; bip.play().catch(()=>{}); return; }
  try{ [0,.3,.6].forEach(t=>{const o=actx.createOscillator();o.frequency.value=880;o.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2);}); }catch(e){}
}
function startTimer(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  tStart=Date.now(); beeped=false; clearInterval(tInt); tInt=setInterval(tick,250); tick();
}
function stopTimer(){ clearInterval(tInt); tStart=null; $('tm').textContent='00:00'; $('tm').classList.remove('over'); $('tlbl').textContent=nomeTreino(); atualizarMidia(0); }
function tick(){
  if(!tStart){ $('tlbl').textContent=nomeTreino(); atualizarMidia(0); return; }
  const s=Math.floor((Date.now()-tStart)/1000);
  $('tm').textContent=fmt(s);
  $('tlbl').textContent=nomeTreino()+' • descanso '+target+'s';
  const over=s>=target; $('tm').classList.toggle('over',over);
  if(over&&!beeped){ beeped=true; beep(); }
  atualizarMidia(s);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBExeZ9Vf2vwM2z_uWzNYZGOlZ34Befiig",
  authDomain: "treinos-teste.firebaseapp.com",
  projectId: "treinos-teste",
  storageBucket: "treinos-teste.firebasestorage.app",
  messagingSenderId: "846488130737",
  appId: "1:846488130737:web:36e06bff4eb998475a3e90"
};

const COLECAO = 'treinos_teste';
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const el = id => document.getElementById(id);
let usuario = null, alvo = null, alvoInfo = {}, ehAdmin = false, alunos = [];

function mostrar(tela) {
  el('telaLogin').style.display = tela === 'login' ? 'flex' : 'none';
  el('telaAdmin').style.display = tela === 'admin' ? 'block' : 'none';
  el('app').style.display = tela === 'app' ? 'block' : 'none';
  window.scrollTo(0, 0);
}

window.entrar = () => signInWithPopup(auth, new GoogleAuthProvider())
  .catch(e => alert('Erro no login: ' + e.message));
window.sair = () => { if (confirm('Sair da conta?')) { encerrarTreino(); signOut(auth); } };

window.salvarNuvem = async () => {
  if (!usuario || !alvo) return;
  try {
    await setDoc(doc(db, COLECAO, alvo), {
      email: alvoInfo.email || '', nome: alvoInfo.nome || '',
      dados: JSON.stringify(data), atualizado: Date.now()
    });
  } catch (e) { alert('Erro ao salvar: ' + e.message); }
};

async function abrirUsuario(uid) {
  const snap = await getDoc(doc(db, COLECAO, uid));
  if (snap.exists()) {
    const d = snap.data();
    alvoInfo = { email: d.email, nome: d.nome };
    setData(JSON.parse(d.dados || '{}'));
    return true;
  }
  return false;
}

// ===== TELA DO ADMIN =====
async function carregarAlunos() {
  const lista = await getDocs(collection(db, COLECAO));
  alunos = lista.docs.map(d => ({ uid: d.id, ...d.data() }));
  alunos.sort((a, b) => (b.uid === usuario.uid) - (a.uid === usuario.uid) ||
    (a.nome || '').localeCompare(b.nome || ''));
  window.renderAlunos(el('buscaAluno').value);
}

window.renderAlunos = (filtro = '') => {
  const f = filtro.toLowerCase(), box = el('listaAlunos');
  box.innerHTML = '';
  alunos.filter(a => `${a.nome} ${a.email}`.toLowerCase().includes(f)).forEach(a => {
    const div = document.createElement('div');
    div.className = 'aluno' + (a.uid === usuario.uid ? ' eu' : '');
    const nm = document.createElement('div'); nm.className = 'nm';
    nm.textContent = (a.uid === usuario.uid ? '⭐ Meu treino — ' : '') + (a.nome || 'Sem nome');
    const em = document.createElement('div'); em.className = 'info';
    em.textContent = a.email || a.uid;
    div.append(nm, em);
    div.onclick = () => window.abrirTreino(a.uid);
    box.appendChild(div);
  });
  if (!box.children.length) box.innerHTML = '<div class="info">Nenhum aluno encontrado.</div>';
};

window.abrirTreino = async (uid) => {
  alvo = uid;
  try { await abrirUsuario(uid); } catch (e) { return alert('Erro: ' + e.message); }
  el('userInfo').textContent = uid === usuario.uid ? '☁️ ' + usuario.email : '👁 Editando treino de: ' + alvoInfo.email;
  el('adminBar').style.display = ehAdmin ? 'block' : 'none';
  mostrar('app');
};

window.voltarAdmin = async () => {
  encerrarTreino();
  el('buscaAluno').value = '';
  try { await carregarAlunos(); } catch (e) { alert('Erro: ' + e.message); }
  mostrar('admin');
};

// ===== LOGIN =====
onAuthStateChanged(auth, async (u) => {
  usuario = u; ehAdmin = false;
  el('adminBar').style.display = 'none';

  if (!u) {
    el('msgLogin').textContent = 'Entre para acessar seus treinos';
    el('btnLogin').style.display = 'block';
    setData(null); mostrar('login'); return;
  }

  el('msgLogin').textContent = 'Carregando...';
  el('btnLogin').style.display = 'none';
  mostrar('login');

  alvo = u.uid;
  alvoInfo = { email: u.email, nome: u.displayName || '' };

  try {
    const existe = await abrirUsuario(u.uid);
    alvoInfo = { email: u.email, nome: u.displayName || '' };
    if (!existe) setData(null);
    localStorage.removeItem(KEY);
    await window.salvarNuvem();

    const adm = await getDoc(doc(db, 'admins', u.email));
    ehAdmin = adm.exists();
  } catch (e) { alert('Erro ao acessar a nuvem: ' + e.message); }

  if (ehAdmin) {
    try { await carregarAlunos(); } catch (e) { alert('Erro: ' + e.message); }
    mostrar('admin');
  } else {
    el('userInfo').textContent = '☁️ ' + u.email;
    mostrar('app');
  }
});
</script>
</body></html>
